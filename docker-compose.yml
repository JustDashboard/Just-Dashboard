# Just Dashboard — self-hosted, single server.
#
# The topology exists to satisfy one rule: the dashboard is root-equivalent and
# must never be reachable from the open internet.
#
#   browser ──(Tailscale, or an SSH tunnel)──▶ proxy:8443
#                                                     ├─ /api  ─▶ backend:8080
#                                                     └─ /*    ─▶ frontend:3000
#
# All three ports are JD_PORT / JD_BACKEND_PORT / JD_FRONTEND_PORT, because
# those defaults are the three most contested numbers on a Linux server and a
# host already using one is the normal case. Change them in .env; the proxy
# reads the same variables, so the three files cannot drift.
#
# The proxy binds to 127.0.0.1 by default, so nothing is exposed until you
# deliberately publish it on a private interface. Serving both halves from one
# origin is also what lets the SameSite=Strict session cookie and the
# same-origin WebSocket checks work as designed.

name: just-dashboard

services:
  backend:
    build:
      context: ./backend
    image: just-dashboard-backend:latest
    restart: unless-stopped
    # The dashboard manages the host, so it shares the host's namespaces.
    # This is the trade the product makes: without it, "restart nginx" and
    # "who is logged in" have no meaning.
    pid: host
    network_mode: host
    privileged: true
    # An explicit map rather than env_file, so that what the container gets is
    # visible here. The cost is that a variable missing from this list is
    # silently ignored however carefully it is set in .env — keep it in step
    # with backend/internal/config, .env.example and the README table.
    environment:
      # Loopback only. The proxy in front of it is the single entry point.
      # The port is a variable for the reason the header gives: 8080 is taken
      # on a great many servers, and the collision used to surface as a
      # dashboard that proxied you to somebody else's application.
      JD_ADDR: 127.0.0.1:${JD_BACKEND_PORT:-8080}
      JD_DATA_DIR: /var/lib/just-dashboard
      # Required. Generate once with: openssl rand -hex 32
      JD_MASTER_KEY: ${JD_MASTER_KEY:?set JD_MASTER_KEY in .env}
      # Who may reach the API at all, checked before authentication.
      JD_ALLOWED_CIDRS: ${JD_ALLOWED_CIDRS:-127.0.0.1/32,::1/128}
      JD_TRUSTED_PROXIES: ${JD_TRUSTED_PROXIES:-127.0.0.1/32}
      JD_ALLOWED_ORIGINS: ${JD_ALLOWED_ORIGINS:-}
      # The address the proxy answers on and how it is trusted. This process
      # binds neither — it is loopback-only in every configuration — but it is
      # the half of the stack that can run `tailscale cert` on the host, and
      # the settings page reports the dashboard's own address from here.
      JD_SITE: ${JD_SITE:-localhost}
      JD_TLS: ${JD_TLS:-internal}
      JD_TERMINAL_ENABLED: ${JD_TERMINAL_ENABLED:-true}
      JD_TERMINAL_SHELL: ${JD_TERMINAL_SHELL:-}
      JD_TERMINAL_USER: ${JD_TERMINAL_USER:-}
      JD_SESSION_TTL: ${JD_SESSION_TTL:-12h}
      JD_SESSION_IDLE_TTL: ${JD_SESSION_IDLE_TTL:-60m}
      # Two-factor is offered to every account and demanded of none, unless
      # this says otherwise. An account that has enrolled is always asked for a
      # code whatever this is set to; what it changes is whether an account
      # that has not enrolled can sign in at all.
      JD_REQUIRE_2FA: ${JD_REQUIRE_2FA:-false}
      # No login page, no session: the hub's certificate is the only caller.
      JD_AGENT_MODE: ${JD_AGENT_MODE:-false}
      # First run only: creates the bootstrap admin with this username/password.
      JD_BOOTSTRAP_USER: ${JD_BOOTSTRAP_USER:-admin}
      JD_BOOTSTRAP_PASSWORD: ${JD_BOOTSTRAP_PASSWORD:-}
      JD_DOCKER_HOST: unix:///var/run/docker.sock
      JD_COMPOSE_ROOTS: ${JD_COMPOSE_ROOTS:-/opt,/srv,/home}
      JD_GIT_ROOTS: ${JD_GIT_ROOTS:-/opt,/srv,/home,/root}
      JD_LOG_ROOTS: ${JD_LOG_ROOTS:-/var/log}
      JD_FILE_ROOTS: ${JD_FILE_ROOTS:-/}
      JD_DEPLOY_ROOTS: ${JD_DEPLOY_ROOTS:-/opt,/srv,/home,/root}
      # Persistent deployment worker capacity and stale-claim recovery.
      JD_DEPLOY_HEAVY_SLOTS: ${JD_DEPLOY_HEAVY_SLOTS:-1}
      JD_DEPLOY_LIGHT_SLOTS: ${JD_DEPLOY_LIGHT_SLOTS:-2}
      JD_DEPLOY_LEASE_TTL: ${JD_DEPLOY_LEASE_TTL:-30s}
      JD_NGINX_DIR: ${JD_NGINX_DIR:-/etc/nginx}
      JD_CADDYFILE: ${JD_CADDYFILE:-/etc/caddy/Caddyfile}
      JD_BACKUP_DIR: ${JD_BACKUP_DIR:-/var/backups/just-dashboard}
      # Metrics history, recorded whether or not a browser is connected.
      JD_METRICS_INTERVAL: ${JD_METRICS_INTERVAL:-15s}
      JD_METRICS_RETENTION: ${JD_METRICS_RETENTION:-7d}
      # Updating the dashboard itself. False disables update discovery;
      # deployment Git branch monitoring remains automatic and independent.
      # JD_UPDATE_DIR is normally empty — the dashboard asks Docker where this
      # stack was deployed from, which is why the label below is not needed.
      JD_UPDATE_CHECK: ${JD_UPDATE_CHECK:-true}
      JD_UPDATE_REPO: ${JD_UPDATE_REPO:-Wayy01/Just-Dashboard}
      JD_UPDATE_BRANCH: ${JD_UPDATE_BRANCH:-main}
      JD_UPDATE_DIR: ${JD_UPDATE_DIR:-}
      JD_LOG_LEVEL: ${JD_LOG_LEVEL:-info}
    volumes:
      # Root-equivalent access. Everything that reaches it is authenticated,
      # capability-checked and written to the audit trail.
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:rslave
      # The dashboard addresses the server by its real paths, so the
      # directories it manages have to appear here under those same paths.
      # Without this the file manager, git discovery and compose-stack
      # scanning quietly operate on this container's own empty filesystem
      # while appearing to browse the server. Narrow this list if you have
      # narrowed JD_FILE_ROOTS and friends to match.
      - /home:/home
      - /opt:/opt
      - /srv:/srv
      - /root:/root
      - /etc:/etc
      # Clipboard images pasted into the web terminal are temporary host
      # files. Mount this one directory at the same absolute path so the path
      # inserted into the host-side PTY names the bytes the backend wrote.
      - /tmp/just-dashboard:/tmp/just-dashboard
      - /var/log:/var/log
      - /var/lib/just-dashboard:/var/lib/just-dashboard
      - /var/backups/just-dashboard:/var/backups/just-dashboard
      - /run/systemd:/run/systemd
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

  frontend:
    build:
      context: ./frontend
    image: just-dashboard-frontend:latest
    restart: unless-stopped
    # The one service with no host access of its own, and the only one that
    # runs unprivileged — so it is also the only one that does not need the
    # host's network namespace. It gets its own, and a published port on
    # loopback that the proxy dials exactly as before.
    #
    # That is what makes a taken port survivable. On the host namespace, Next
    # failed to bind, the container went into a restart loop, and the proxy's
    # catch-all forwarded to whatever already held 3000 — so the operator
    # opened the dashboard and got a stranger's application over the
    # dashboard's own certificate, with nothing anywhere saying why. With the
    # port published instead, Docker itself refuses: `docker compose up` stops
    # with "Bind for 127.0.0.1:3000 failed: port is already allocated", naming
    # the port, before anything is serving. The installer and lifecycle runner
    # detect that conflict, persist an available port in .env, and retry.
    #
    # Inside the container the port is always 3000; only the host side is a
    # variable, because only the host side can collide.
    networks:
      - internal
    ports:
      - "127.0.0.1:${JD_FRONTEND_PORT:-3000}:3000"
    environment:
      # 0.0.0.0 within its own namespace, which is reachable only through the
      # loopback-bound mapping above. It is not exposed to the network.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    # Also on the host namespace, so it reaches both services on loopback.
    # JD_SITE is the address the stack answers on, and a name its certificate
    # is issued for: leave it at localhost and tunnel in, or set it to your
    # Tailscale or WireGuard address. Loopback is bound alongside it either
    # way, so an SSH tunnel is always available. Never set it to 0.0.0.0.
    network_mode: host
    # The entrypoint turns one setting, JD_TLS, into the scheme and the tls
    # directive the Caddyfile needs. A Caddyfile cannot branch, and the
    # alternative — an installer that edits a tracked file — would make every
    # future `git pull` a merge conflict.
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    environment:
      JD_SITE: ${JD_SITE:-localhost}
      # What it listens on, when that is not the address above. Blank is the
      # ordinary case; a Tailscale install answers for a MagicDNS name and
      # binds the tailnet IP behind it, because this container resolves names
      # through Docker's resolver rather than the host's.
      JD_BIND: ${JD_BIND:-}
      # tailscale | internal | off — see deploy/proxy-entrypoint.sh.
      JD_TLS: ${JD_TLS:-internal}
      # The same three numbers the other two services bind, read from one
      # place. A proxy listening on one port while the service it forwards to
      # binds another is exactly the failure these variables exist to remove.
      JD_PORT: ${JD_PORT:-8443}
      JD_BACKEND_PORT: ${JD_BACKEND_PORT:-8080}
      JD_FRONTEND_PORT: ${JD_FRONTEND_PORT:-3000}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/proxy-entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      # Where `tailscale cert` writes, and the backend renews. Read-only here:
      # this container serves the certificate and never issues one.
      - /var/lib/just-dashboard/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

# The frontend's own network. It exists so that service can be off the host
# namespace — nothing else joins it, and nothing on it can reach the host.
networks:
  internal:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
