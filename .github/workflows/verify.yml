name: Verify

on:
  pull_request:
  push:
    branches: [main, "patch/**"]
  workflow_dispatch:

permissions:
  contents: read

# A pull request has one run, its newest. A push to a release branch has its
# own and is never cancelled: that run is the only check of the merge it made.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# What a run costs is decided by three things, and each used to be spent
# without being looked at.
#
# What it checks. `plan` reads the change and starts only what it can reach
# (scripts/ci-plan.py says how each job's share is picked), against the whole
# pull request as it would merge, not against the push before. Every push used
# to run every suite of whichever half it touched, and a second push that only
# fixed a comment compared with the first and so hid its failure.
#
# How many jobs it starts. GitHub runs twenty jobs of a public repository's at
# once, across every branch, and queues the rest, so a suite split further
# than one runner's four cores can use only moves its wait into the queue, and
# into every other pull request's. Forty-one jobs a push took twenty-two
# minutes; the eighteen a change to this file starts take fourteen.
#
# Where its caches are. A run reads the caches of its own branch and of the
# branch it merges into, never a sibling's, so a cache saved on a task branch
# was read by nobody and cost the repository's ten gigabytes. Only a run on a
# release branch saves; pull requests into it restore.
#
# Everything runs on GitHub's hosted runners, the live Docker fixtures too.
# They used to take a self-hosted runner on the machine that serves the
# dashboard, which put their builds on the production daemon and left every
# run waiting whenever that service was down.

env:
  # A push to a release branch, or a manual run on one.
  SAVE_CACHES: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || startsWith(github.ref_name, 'patch/')) }}
  # Where the caches below are restored to, said rather than assumed.
  GOMODCACHE: /home/runner/go/pkg/mod
  GOCACHE: /home/runner/.cache/go-build
  JD_TEST_POSTGRES_DSN: postgres://jd_test:jd_test@127.0.0.1:1/jd_test?sslmode=disable
  JD_TEST_MYSQL_DSN: jd_test:jd_test@tcp(127.0.0.1:1)/jd_test
  JD_TEST_MSSQL_DSN: sqlserver://jd_test:jd_test@127.0.0.1:1?database=jd_test
  JD_TEST_ORACLE_DSN: oracle://jd_test:jd_test@127.0.0.1:1/FREE
  JD_TEST_CLICKHOUSE_DSN: clickhouse://jd_test:jd_test@127.0.0.1:1/jd_test
  JD_TEST_MONGO_DSN: mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=100
  JD_TEST_REDIS_DSN: redis://127.0.0.1:1

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      go_packages: ${{ steps.plan.outputs.go_packages }}
      go_plain: ${{ steps.plan.outputs.go_plain }}
      go_budgets: ${{ steps.plan.outputs.go_budgets }}
      race: ${{ steps.plan.outputs.race }}
      race_jobs: ${{ steps.plan.outputs.race_jobs }}
      live: ${{ steps.plan.outputs.live }}
      live_jobs: ${{ steps.plan.outputs.live_jobs }}
      frontend: ${{ steps.plan.outputs.frontend }}
      lint: ${{ steps.plan.outputs.lint }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_specs: ${{ steps.plan.outputs.browser_specs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The history without its files: enough to name what changed.
          fetch-depth: 0
          filter: blob:none
      - id: plan
        name: Decide what this change reaches
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge into the base, whose
          # first parent is that base. A new branch or a manual run has
          # nothing to compare with, so it runs everything.
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          elif [ "$EVENT" = push ] && [ "${BEFORE//0/}" != "" ] &&
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          # shellcheck disable=SC2086
          python3 scripts/ci-plan.py $base | tee -a "$GITHUB_OUTPUT"
      - name: Check the planner
        if: steps.plan.outputs.scripts == 'true'
        run: python3 scripts/test_ci_plan.py

  backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          # Its cache is one key shared by every job and never saved twice,
          # and the one this repository held restored without the modules:
          # each job downloaded and compiled all of them on every run.
          cache: false
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ hashFiles('backend/go.sum') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: go-build-${{ hashFiles('backend/go.sum') }}-
      - name: Build, vet and test
        env:
          PACKAGES: ${{ needs.plan.outputs.go_packages }}
          PLAIN: ${{ needs.plan.outputs.go_plain }}
          BUDGETS: ${{ needs.plan.outputs.go_budgets }}
        run: |
          mkdir -p "$RUNNER_TEMP/jd-ci"
          go version | tee "$RUNNER_TEMP/jd-ci/go-version.txt"
          # shellcheck disable=SC2086
          if [ -n "$PACKAGES" ]; then
            go build ./... 2>&1 | tee "$RUNNER_TEMP/jd-ci/backend-build.txt"
            go vet $PACKAGES 2>&1 | tee "$RUNNER_TEMP/jd-ci/backend-vet.txt"
          fi
          # The packages of the race gate are left to it: it runs every one of
          # their tests but the budgets, which are asserted here.
          # shellcheck disable=SC2086
          if [ -n "$PLAIN" ]; then
            go test -count=1 -json $PLAIN | tee "$RUNNER_TEMP/jd-ci/backend-tests.jsonl"
          fi
          # shellcheck disable=SC2086
          if [ -n "$BUDGETS" ]; then
            go test -count=1 -json -run StaysWithinItsBudgetAtReferenceScale $BUDGETS |
              tee "$RUNNER_TEMP/jd-ci/backend-budgets.jsonl"
          fi
      - name: Retain backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence
          path: ${{ runner.temp }}/jd-ci/
          retention-days: 30
      # A key is saved once, so what is saved has to be all of it: this run
      # downloaded only what its own packages import.
      - if: env.SAVE_CACHES == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: go mod download
      - if: env.SAVE_CACHES == 'true' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ hashFiles('backend/go.sum') }}
      - if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}

  race:
    needs: plan
    if: needs.plan.outputs.race != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.race) }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ hashFiles('backend/go.sum') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-race-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: go-race-${{ hashFiles('backend/go.sum') }}-
      - name: Race gate
        run: |
          mkdir -p "$RUNNER_TEMP/jd-ci"
          ../scripts/go-test-race.sh ${{ fromJSON(needs.plan.outputs.race_jobs)[matrix.name].procs }} \
            ${{ fromJSON(needs.plan.outputs.race_jobs)[matrix.name].packages }} |
            tee "$RUNNER_TEMP/jd-ci/backend-race-${{ matrix.name }}.jsonl"
      - name: Retain race evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: race-evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/jd-ci/
          retention-days: 30
      # ./internal/api imports nearly every package, so what it compiled is
      # what the other job needs as well.
      - if: env.SAVE_CACHES == 'true' && matrix.name == 'api'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-race-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}

  frontend:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/package.json
      - id: bun
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/bun.lock') }}
      # What tsc learned about each file last time, by the file's contents: a
      # run type-checks what changed since and what depends on it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tsc
          key: tsc-${{ hashFiles('frontend/bun.lock') }}-${{ github.sha }}
          restore-keys: tsc-${{ hashFiles('frontend/bun.lock') }}-
      - name: Lint, types and unit tests
        env:
          LINT: ${{ needs.plan.outputs.lint }}
        run: |
          mkdir -p "$RUNNER_TEMP/jd-ci"
          bun install --frozen-lockfile
          bun --version | tee "$RUNNER_TEMP/jd-ci/bun-version.txt"
          # shellcheck disable=SC2086
          if [ -n "$LINT" ]; then
            bunx eslint --no-warn-ignored $LINT 2>&1 | tee "$RUNNER_TEMP/jd-ci/frontend-lint.txt"
          fi
          mkdir -p "$RUNNER_TEMP/tsc"
          bunx tsc --noEmit --tsBuildInfoFile "$RUNNER_TEMP/tsc/tsconfig.tsbuildinfo" 2>&1 |
            tee "$RUNNER_TEMP/jd-ci/frontend-types.txt"
          bun run test 2>&1 | tee "$RUNNER_TEMP/jd-ci/frontend-unit.txt"
      - name: Retain frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-evidence
          path: ${{ runner.temp }}/jd-ci/
          retention-days: 30
      - if: env.SAVE_CACHES == 'true' && steps.bun.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/bun.lock') }}
      - if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tsc
          key: tsc-${{ hashFiles('frontend/bun.lock') }}-${{ github.sha }}

  browser:
    needs: plan
    if: needs.plan.outputs.browser != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.browser) }}
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/package.json
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('frontend/bun.lock') }}
      - id: playwright
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/bun.lock') }}
      # Next's compiler cache: a build whose sources barely moved reuses the
      # last one's work, which is the difference between a build of a quarter
      # of a minute in every shard and one of a minute.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('frontend/bun.lock') }}-
      - name: Install locked dependencies and Chromium
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Production build and browser specs
        env:
          SPECS: ${{ fromJSON(needs.plan.outputs.browser_specs)[matrix.shard] }}
        run: |
          mkdir -p "$RUNNER_TEMP/jd-ci"
          bun run build 2>&1 | tee "$RUNNER_TEMP/jd-ci/frontend-build.txt"
          # shellcheck disable=SC2086
          bunx playwright test $SPECS 2>&1 | tee "$RUNNER_TEMP/jd-ci/frontend-browser.txt"
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/jd-ci/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30
      # Every shard built the same thing; one of them keeps it.
      - if: env.SAVE_CACHES == 'true' && matrix.shard == 1 && steps.playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/bun.lock') }}
      - if: env.SAVE_CACHES == 'true' && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/bun.lock') }}-${{ github.sha }}

  live:
    needs: plan
    if: needs.plan.outputs.live != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.live) }}
    env:
      JD_DEPLOY_LIVE: "1"
      FIXTURES: ${{ toJSON(fromJSON(needs.plan.outputs.live_jobs)[matrix.name]) }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ hashFiles('backend/go.sum') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: go-build-${{ hashFiles('backend/go.sum') }}-
      - name: Upgrade the Docker daemon
        # The hosted image ships Docker 28, which refuses a fixed container
        # address on a network with an automatic subnet; the database fixture
        # holds an address that way, as the release host's daemon allows.
        if: fromJSON(env.FIXTURES).docker
        run: |
          curl -fsSL https://get.docker.com | sudo sh
          docker version --format '{{.Server.Version}}'
      - name: Live fixtures
        env:
          JD_CUTOVER_EVIDENCE: ${{ runner.temp }}/jd-ci/cutover-traffic.json
          NAME: ${{ matrix.name }}
          PACKAGES: ${{ fromJSON(env.FIXTURES).packages }}
          RUN: ${{ fromJSON(env.FIXTURES).run }}
          SKIP: ${{ fromJSON(env.FIXTURES).skip }}
          TESTS: ${{ fromJSON(env.FIXTURES).tests }}
        run: |
          mkdir -p "$RUNNER_TEMP/jd-ci"
          docker version | tee "$RUNNER_TEMP/jd-ci/docker-version.txt"
          go version | tee "$RUNNER_TEMP/jd-ci/go-version.txt"
          # One package at a time: the fixtures share the daemon.
          # shellcheck disable=SC2086
          go test -count=1 -p 1 -timeout 45m -json $PACKAGES -run "$RUN" ${SKIP:+-skip "$SKIP"} |
            tee "$RUNNER_TEMP/jd-ci/live-$NAME.jsonl"
          # shellcheck disable=SC2086
          python3 ../scripts/check-live-test-results.py "$RUNNER_TEMP/jd-ci/live-$NAME.jsonl" $TESTS
      - name: Retain live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/jd-ci/
          retention-days: 30
