name: Feature request
description: Suggest an improvement to Just Dashboard.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep each request focused on one improvement and the task it would help you complete.
        For something that is broken, use the bug report form.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the existing issues for this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to complete and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Describe how you would expect the dashboard to behave and where the change would fit.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: How do you handle this today? Mention other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, links, or mockups that help explain the request. Remove private information from attachments.
