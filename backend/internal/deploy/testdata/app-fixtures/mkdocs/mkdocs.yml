site_name: MkDocs fixture
site_description: !ENV [PUBLIC_API_URL, "no value"]
theme:
  name: material
  features:
    - navigation.instant
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
nav:
  - Home: index.md
  - Guide: guide.md
